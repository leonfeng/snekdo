<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - snekdo</title>
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            color: #333;
            background: #fff;
            line-height: 1.5;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        nav {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #333;
        }
        nav a {
            margin-right: 1rem;
            color: #333;
            text-decoration: none;
            font-weight: 600;
        }
        nav a:hover {
            color: #007bff;
        }
        nav a.logout {
            float: right;
            color: #dc3545;
        }
        nav a.logout:hover {
            color: #a71d2a;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        th, td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            font-weight: 600;
            background: #f8f9fa;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .btn {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            color: #fff;
            background: #007bff;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            text-decoration: none;
            margin-right: 0.25rem;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #a71d2a;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #1e7e34;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 0.25rem;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }
        .error {
            color: #dc3545;
            background: #fff5f5;
            padding: 0.5rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
        }
        .empty {
            text-align: center;
            color: #666;
            padding: 2rem;
            font-style: italic;
        }
        .detail-label {
            font-weight: 600;
            color: #666;
            margin-bottom: 0.25rem;
        }
        .detail-value {
            margin-bottom: 1rem;
        }
        @media (max-width: 600px) {
            table {
                font-size: 0.875rem;
            }
            th, td {
                padding: 0.375rem;
            }
            .btn {
                padding: 0.2rem 0.4rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/">snekdo</a>
            <a href="/todos">Todos</a>
            <a href="/todos/add">Add New</a>
            <a href="/auth/logout" class="logout">Logout</a>
        </nav>
        <h1>{{ title }}</h1>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
