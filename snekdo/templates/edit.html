{% extends "base.html" %}
{% block content %}
<form method="post" action="/todos/{{ todo.id }}/edit">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ todo.title }}" required>
    </div>
    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3">{{ todo.description }}</textarea>
    </div>
    <div class="form-group">
        <label for="due">Due Date</label>
        <input type="date" id="due" name="due" value="{{ todo.due }}">
    </div>
    <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
            <option value="low" {% if todo.priority == "low" %}selected{% endif %}>Low</option>
            <option value="medium" {% if todo.priority == "medium" %}selected{% endif %}>Medium</option>
            <option value="high" {% if todo.priority == "high" %}selected{% endif %}>High</option>
        </select>
    </div>
    <div class="form-group">
        <label for="repeat">Repeat</label>
        <select id="repeat" name="repeat">
            <option value="none" {% if todo.repeat == "none" %}selected{% endif %}>None</option>
            <option value="daily" {% if todo.repeat == "daily" %}selected{% endif %}>Daily</option>
            <option value="weekly" {% if todo.repeat == "weekly" %}selected{% endif %}>Weekly</option>
            <option value="monthly" {% if todo.repeat == "monthly" %}selected{% endif %}>Monthly</option>
            <option value="yearly" {% if todo.repeat == "yearly" %}selected{% endif %}>Yearly</option>
        </select>
    </div>
    <button type="submit" class="btn">Update Todo</button>
</form>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
{% endblock %}
