{% extends "base.html" %}
{% block content %}
<form method="post" action="/todos/{{ todo.id }}/edit">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ todo.title }}" required>
    </div>
    <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3">{{ todo.description }}</textarea>
    </div>
    <div class="form-group">
        <label for="due">Due Date</label>
        <input type="date" id="due" name="due" value="{{ todo.due }}">
    </div>
    <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
            <option value="low" {% if todo.priority == "low" %}selected{% endif %}>Low</option>
            <option value="medium" {% if todo.priority == "medium" %}selected{% endif %}>Medium</option>
            <option value="high" {% if todo.priority == "high" %}selected{% endif %}>High</option>
        </select>
    </div>
    <button type="submit" class="btn">Update Todo</button>
</form>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
{% endblock %}
