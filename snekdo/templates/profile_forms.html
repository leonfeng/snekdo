<h2>Update Profile</h2>
<form method="post" hx-post="/profile/update" hx-target=".profile-info" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="update_display_name">Display Name</label>
        <input type="text" name="display_name" id="update_display_name" value="{{ user.display_name }}">
    </div>
    <div class="form-group">
        <label for="update_email">Email</label>
        <input type="email" name="email" id="update_email" value="{{ user.email }}">
    </div>
    <button type="submit" class="btn">Update Profile</button>
</form>

<h2>Change Password</h2>
<form method="post" hx-post="/profile/password" hx-target=".profile-info" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="current_password">Current Password</label>
        <input type="password" name="current_password" id="current_password" required autocomplete="off">
    </div>
    <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" required autocomplete="off">
    </div>
    <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" name="confirm_password" id="confirm_password" required autocomplete="off">
    </div>
    <button type="submit" class="btn btn-danger">Change Password</button>
</form>

<h2>Delete Account</h2>
<form method="post" hx-post="/profile/delete" hx-target=".profile-info" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label for="delete_password">Password</label>
        <input
            type="password"
            name="current_password"
            id="delete_password"
            required
            autocomplete="off"
            placeholder="Enter your password to confirm"
        >
    </div>
    <button
        type="submit"
        class="btn btn-danger"
        onclick="return confirm('Are you sure you want to delete your account? This action cannot be undone.')"
    >
        Delete Account
    </button>
</form>
