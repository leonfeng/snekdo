<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Deleted - snekdo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            background: #f9fafb;
            line-height: 1.5;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        .success-message {
            background: #f0fff4;
            color: #22543d;
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Account Deleted</h1>
        <p class="success-message">Your account has been successfully deleted.</p>
        <p><a href="/auth/login">Sign in with a different account</a></p>
    </div>

</html>
