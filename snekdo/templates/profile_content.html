<div id="profile-content">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div class="profile-info">
        <h2>Profile Information</h2>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" value="{{ user.username }}" disabled>
        </div>
        <div class="form-group">
            <label for="display_name">Display Name</label>
            <input type="text" id="display_name" value="{{ user.display_name }}" disabled>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" value="{{ user.email }}" disabled>
        </div>
        <div class="form-group">
            <label for="created_at">Created At</label>
            <input type="text" id="created_at" value="{{ user.created_at }}" disabled>
        </div>
    </div>

    <h2>Update Profile</h2>
    <form hx-post="/profile/update" hx-target="#profile-content" hx-swap="innerHTML">
        <div class="form-group">
            <label for="update_display_name">Display Name</label>
            <input type="text" name="display_name" id="update_display_name" value="{{ user.display_name }}">
        </div>
        <div class="form-group">
            <label for="update_email">Email</label>
            <input type="email" name="email" id="update_email" value="{{ user.email }}">
        </div>
        <button type="submit" class="btn">Update Profile</button>
    </form>

    <h2>Change Password</h2>
    <form hx-post="/profile/password" hx-target="#profile-content" hx-swap="innerHTML">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" name="current_password" id="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" name="new_password" id="new_password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-danger">Change Password</button>
    </form>
</div>
